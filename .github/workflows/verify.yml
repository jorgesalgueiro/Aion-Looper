name: Verify migration foundation
on: [push, pull_request]
jobs:
  clap-abi:
    strategy:
      matrix:
        include:
          - os: windows-latest
            library: looper_clap.dll
          - os: ubuntu-latest
            library: liblooper_clap.so
          - os: macos-latest
            library: liblooper_clap.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p looper-host -p looper-clap
      - run: cargo build --release -p looper-clap
      - run: cargo run -p looper-clap --example host -- target/release/${{ matrix.library }}
  core-and-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: node scripts/generate-dsp-fixtures.cjs
      - run: git diff --exit-code -- crates/looper-core/tests/fixtures/original_dsp.rs
      - run: node scripts/generate-stretch-adapter.cjs
      - run: git diff --exit-code -- crates/looper-desktop/assets/stretch-edits.json
      - run: cargo test --workspace
      - run: node --test "crates/looper-desktop/tests/*.test.cjs"
      - name: JACK adapter compilation
        if: runner.os == 'Linux'
        run: cargo check -p looper-cli --features jack
      - run: node --test "tests/*.test.cjs"
        working-directory: ui
      - name: Package Linux desktop, CLI and CLAP; validate packaged ABI
        if: runner.os == 'Linux'
        run: bash scripts/build-linux.sh
      - name: Native audio GUI without browser audio or hardware devices
        if: runner.os == 'Linux'
        run: xvfb-run -a bash scripts/test-native-audio-linux.sh
  ios-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: cargo check --locked --workspace --target aarch64-apple-ios
