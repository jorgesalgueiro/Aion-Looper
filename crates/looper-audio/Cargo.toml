[package]
name = "looper-audio"
description = "Native devices and bounded realtime control for Rust-Looper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
jack = ["cpal/jack"]
asio = ["cpal/asio"]

[dependencies]
looper-core = { path = "../looper-core" }
cpal = "=0.18.2"
rtrb = "=0.4.0"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_WinRT", "Security_Authorization_AppCapabilityAccess", "Media_Audio", "Media_Capture", "Media_Render", "Media_MediaProperties"] }


