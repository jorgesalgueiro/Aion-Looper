[package]
name = "looper-desktop"
description = "Original Ascii-Looper interface in a native Rust desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "Aion-Looper"
path = "src/main.rs"

[lib]
name = "rust_looper_desktop"
crate-type = ["rlib"]

[features]
default = []
jack = ["looper-audio/jack"]
asio = ["looper-audio/asio"]

[dependencies]
looper-core = { path = "../looper-core" }
looper-files = { path = "../looper-files" }
looper-audio = { path = "../looper-audio" }
looper-stretch = { path = "../looper-stretch" }
looper-midi = { path = "../looper-midi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
tao = "=0.37.1"
wry = "=0.57.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
