# Use only for an explicitly selected WSLg test process via ALSA_CONFIG_PATH.
# Never changes /etc/asound.conf or the user's ~/.asoundrc.
</usr/share/alsa/alsa.conf>
pcm.!default {
    type pulse
    server "unix:/mnt/wslg/PulseServer"
    hint.description "WSLg default input/output via PulseAudio"
}
ctl.!default {
    type pulse
    server "unix:/mnt/wslg/PulseServer"
}
